<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">SafeWorld benchmark and Goal2 pilot pipeline</title>
  <desc id="desc">Temporal safety tasks are grounded in simulation, trajectories are collected, a DreamerV3-style RSSM is trained and used in an offline verifier and action-baseline pilot, and results are reported with scope limitations.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .heading { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 16px Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1280" height="520" rx="24" fill="#f8fafc"/>
  <text class="title" x="52" y="58">SafeWorld benchmark → Goal2 pilot evaluation</text>
  <text class="subtitle" x="52" y="88">An empirical research pipeline built around temporal safety requirements for embodied agents</text>

  <g>
    <rect x="48" y="132" width="264" height="252" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="48" y="132" width="264" height="10" rx="5" fill="#2563eb"/>
    <circle cx="80" cy="176" r="18" fill="#dbeafe"/><text x="80" y="182" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1d4ed8">1</text>
    <text class="heading" x="108" y="183">Task benchmark</text>
    <text class="body" x="72" y="224"><tspan x="72" dy="0">23 task instances across</tspan><tspan x="72" dy="25">Safety Gymnasium tasks</tspan><tspan x="72" dy="34">Temporal requirements are</tspan><tspan x="72" dy="24">grounded as task-specific</tspan><tspan x="72" dy="24">finite-trace checks.</tspan></text>
    <text class="small" x="72" y="354">15 distinct formula strings</text>
  </g>

  <g>
    <rect x="360" y="132" width="264" height="252" rx="18" fill="#fff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="360" y="132" width="264" height="10" rx="5" fill="#059669"/>
    <circle cx="392" cy="176" r="18" fill="#d1fae5"/><text x="392" y="182" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#047857">2</text>
    <text class="heading" x="420" y="183">Simulation data</text>
    <text class="body" x="384" y="224"><tspan x="384" dy="0">Goal2 trajectories from</tspan><tspan x="384" dy="25">scripted, task-aware control</tspan><tspan x="384" dy="34">Success, perturbed, and</tspan><tspan x="384" dy="24">failure/recovery episodes</tspan><tspan x="384" dy="34">Labels include task signals</tspan><tspan x="384" dy="24">such as hazard and goal.</tspan></text>
  </g>

  <g>
    <rect x="672" y="132" width="264" height="252" rx="18" fill="#fff" stroke="#ddd6fe" stroke-width="2"/>
    <rect x="672" y="132" width="264" height="10" rx="5" fill="#7c3aed"/>
    <circle cx="704" cy="176" r="18" fill="#ede9fe"/><text x="704" y="182" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#6d28d9">3</text>
    <text class="heading" x="732" y="183">Latent model</text>
    <text class="body" x="696" y="224"><tspan x="696" dy="0">DreamerV3-style RSSM</tspan><tspan x="696" dy="25">with observation and reward</tspan><tspan x="696" dy="24">prediction plus safety heads</tspan><tspan x="696" dy="34">Auxiliary signals include cost,</tspan><tspan x="696" dy="24">speed, goal distance, and</tspan><tspan x="696" dy="24">nearest-hazard distance.</tspan></text>
  </g>

  <g>
    <rect x="984" y="132" width="248" height="252" rx="18" fill="#fff" stroke="#fed7aa" stroke-width="2"/>
    <rect x="984" y="132" width="248" height="10" rx="5" fill="#ea580c"/>
    <circle cx="1016" cy="176" r="18" fill="#ffedd5"/><text x="1016" y="182" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#c2410c">4</text>
    <text class="heading" x="1044" y="183">Pilot evaluation</text>
    <text class="body" x="1008" y="224"><tspan x="1008" dy="0">Verifier and action-level</tspan><tspan x="1008" dy="25">baseline comparisons on</tspan><tspan x="1008" dy="24">the currently supported set</tspan><tspan x="1008" dy="34">30 rollouts, up to 150 steps,</tspan><tspan x="1008" dy="24">one seed in the saved note</tspan></text>
    <text class="small" x="1008" y="354">Empirical pilot evidence</text>
  </g>

  <path d="M318 258 H350" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M630 258 H662" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M942 258 H974" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="48" y="410" width="1184" height="70" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="72" y="440" font-family="Arial" font-size="16" font-weight="700" fill="#1e3a8a">How to read the results</text>
  <text class="small" x="72" y="463">The Goal2 verifier encodes recorded observations through the RSSM posterior. Unsupported signals are N/A; baseline compliance is empirical, not a formal warrant.</text>
</svg>
